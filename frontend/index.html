<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabil Voices - Professional Audio Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Audio Player Range Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: #4b5563;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Equalizer Animation for Active Track */
        .equalizer {
            display: inline-flex;
            gap: 2px;
            height: 14px;
            align-items: flex-end;
        }
        .equalizer .bar {
            width: 3px;
            background-color: #3b82f6;
            border-radius: 1px;
            animation: eq-bounce 1s infinite ease-in-out;
        }
        .equalizer .bar:nth-child(2) { animation-delay: 0.2s; }
        .equalizer .bar:nth-child(3) { animation-delay: 0.4s; }
        .equalizer .bar:nth-child(4) { animation-delay: 0.1s; }
        
        @keyframes eq-bounce {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <!-- Theme Manager Script -->
    <script>
        function applyTheme(theme) {
            if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            localStorage.setItem('theme', theme);
        }
        const storedTheme = localStorage.getItem('theme') || 'system';
        applyTheme(storedTheme);
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 h-screen flex flex-col font-sans transition-colors duration-200 selection:bg-blue-200 dark:selection:bg-blue-900">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-900 shadow-sm dark:border-b dark:border-gray-800 py-4 px-6 flex justify-between items-center transition-colors duration-200 z-10">
        <div class="flex items-center gap-4">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-microphone-lines text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900 dark:text-white tracking-tight">Kabil Studio</h1>
                <div class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider mt-0.5">
                    Audio & Voice Management
                </div>
            </div>
        </div>
        
        <!-- Theme Switcher -->
        <div class="flex items-center bg-gray-100 dark:bg-gray-800 p-1 rounded-lg border border-gray-200 dark:border-gray-700">
            <button onclick="setTheme('light')" id="theme-light" class="theme-btn px-3 py-1.5 rounded-md text-xs font-bold transition-all text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                <i class="fa-solid fa-sun mr-1.5"></i> Light
            </button>
            <button onclick="setTheme('dark')" id="theme-dark" class="theme-btn px-3 py-1.5 rounded-md text-xs font-bold transition-all text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                <i class="fa-solid fa-moon mr-1.5"></i> Dark
            </button>
            <button onclick="setTheme('system')" id="theme-system" class="theme-btn px-3 py-1.5 rounded-md text-xs font-bold transition-all text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                <i class="fa-solid fa-desktop mr-1.5"></i> Auto
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden flex flex-col max-w-7xl mx-auto w-full p-6 gap-6">
        
        <!-- Toolbar & Filters -->
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between bg-white dark:bg-gray-900 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 transition-colors duration-200">
            
            <div class="text-sm font-semibold text-gray-600 dark:text-gray-300">
                Voice Database
            </div>

            <!-- Filters -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="language-filter" class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 font-medium transition-colors">
                    <option value="all">All Languages</option>
                    <option value="Chakma">Chakma</option>
                    <option value="Pali">Pali</option>
                    <option value="Bengali">Bengali</option>
                    <option value="English">English</option>
                </select>
                <div class="relative flex-1 md:w-64">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fa-solid fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="search-input" class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5 placeholder-gray-400 transition-colors" placeholder="Search transcripts...">
                </div>
            </div>
        </div>

        <!-- Voice List Table -->
        <div class="flex-1 overflow-hidden flex flex-col bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-800 transition-colors duration-200">
            <div class="overflow-y-auto flex-1">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead class="text-xs text-gray-500 dark:text-gray-400 uppercase bg-gray-50 dark:bg-gray-800/50 sticky top-0 z-10 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
                        <tr>
                            <th scope="col" class="px-6 py-4 font-semibold tracking-wider">ID / Name</th>
                            <th scope="col" class="px-6 py-4 font-semibold tracking-wider">Language</th>
                            <th scope="col" class="px-6 py-4 w-1/2 font-semibold tracking-wider">Transcript</th>
                            <th scope="col" class="px-6 py-4 font-semibold tracking-wider text-center">Status</th>
                            <th scope="col" class="px-6 py-4 font-semibold tracking-wider text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="voice-list-body" class="divide-y divide-gray-100 dark:divide-gray-800/60">
                        <!-- Javascript will populate rows here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="flex justify-between items-center p-4 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50">
                <span class="text-sm text-gray-600 dark:text-gray-400">
                    Showing <span id="page-start" class="font-bold text-gray-900 dark:text-white">1</span> to <span id="page-end" class="font-bold text-gray-900 dark:text-white">10</span> of <span id="total-items" class="font-bold text-gray-900 dark:text-white">0</span> audio tracks
                </span>
                <div class="inline-flex gap-2">
                    <button id="prev-btn" class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm">
                        Previous
                    </button>
                    <button id="next-btn" class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm">
                        Next
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Professional Audio Player (Floating Bottom) -->
    <div class="bg-white/90 dark:bg-gray-900/95 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.1)] dark:shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.5)] px-6 py-4 sticky bottom-0 w-full z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-8">
            
            <!-- Now Playing Indicator & Meta -->
            <div class="flex items-center gap-4 w-full md:w-1/4 min-w-[250px]">
                <div id="player-art" class="w-14 h-14 bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-700 rounded-xl flex items-center justify-center text-gray-400 dark:text-gray-500 shadow-inner overflow-hidden relative transition-all">
                    <i class="fa-solid fa-music text-xl absolute"></i>
                    <!-- Equalizer overlay (shown only when playing) -->
                    <div id="player-eq" class="absolute inset-0 bg-blue-600/90 flex items-center justify-center opacity-0 transition-opacity">
                        <div class="equalizer">
                            <div class="bar bg-white"></div><div class="bar bg-white"></div><div class="bar bg-white"></div><div class="bar bg-white"></div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 truncate">
                    <h4 id="now-playing-title" class="font-bold text-gray-900 dark:text-white text-base truncate">Ready to play</h4>
                    <p id="now-playing-lang" class="text-sm text-blue-600 dark:text-blue-400 font-medium truncate">Select an audio track</p>
                </div>
            </div>

            <!-- Master Controls & Scrubber -->
            <div class="flex-1 flex flex-col items-center w-full max-w-3xl px-4">
                <div class="flex items-center gap-6 mb-3">
                    <button id="btn-prev" class="text-gray-400 hover:text-gray-900 dark:text-gray-500 dark:hover:text-white transition-colors text-lg" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="play-pause-btn" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white hover:bg-blue-500 hover:scale-105 transition-all shadow-lg shadow-blue-500/40 disabled:bg-gray-300 dark:disabled:bg-gray-800 disabled:shadow-none disabled:cursor-not-allowed disabled:transform-none" disabled>
                        <i class="fa-solid fa-play ml-1 text-lg" id="play-icon"></i>
                    </button>
                    <button id="btn-next" class="text-gray-400 hover:text-gray-900 dark:text-gray-500 dark:hover:text-white transition-colors text-lg" title="Next"><i class="fa-solid fa-forward-step"></i></button>
                    
                    <!-- Single Playback Mode Cycle Button -->
                    <div class="h-6 w-px bg-gray-300 dark:bg-gray-700 mx-2"></div>
                    <button id="mode-btn" class="text-blue-600 dark:text-blue-400 transition-colors text-lg w-6 flex justify-center items-center" title="Mode: Play All">
                        <i id="mode-icon" class="fa-solid fa-list-ul"></i>
                    </button>
                </div>
                <div class="flex items-center gap-4 w-full group">
                    <span id="time-current" class="text-xs font-bold text-gray-500 dark:text-gray-400 w-10 text-right tabular-nums">0:00</span>
                    <div class="flex-1 relative flex items-center">
                        <input type="range" id="seek-bar" value="0" min="0" max="100" class="w-full z-10" disabled>
                    </div>
                    <span id="time-total" class="text-xs font-bold text-gray-500 dark:text-gray-400 w-10 tabular-nums">0:00</span>
                </div>
            </div>

            <!-- Volume & Settings -->
            <div class="flex items-center gap-3 w-full md:w-1/4 justify-end min-w-[200px]">
                <i id="vol-icon" class="fa-solid fa-volume-high text-gray-500 dark:text-gray-400 w-5 text-center"></i>
                <input type="range" id="volume-bar" value="100" min="0" max="100" class="w-28 accent-blue-600">
            </div>

        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-element" preload="metadata"></audio>

    <script>
        // --- Theme Engine ---
        function updateThemeUI() {
            const currentTheme = localStorage.getItem('theme') || 'system';
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white', 'shadow-sm', 'border', 'border-gray-200', 'dark:border-gray-600');
            });
            const activeBtn = document.getElementById(`theme-${currentTheme}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-white', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white', 'shadow-sm', 'border', 'border-gray-200', 'dark:border-gray-600');
            }
        }
        function setTheme(theme) { applyTheme(theme); updateThemeUI(); }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'system') applyTheme('system');
        });
        updateThemeUI();

        // --- Data ---
        const allVoices = [
            { id: 1, name: "Sample 1", language: "Chakma", transcript: "তুই কেজান আগচ?", status: "Ready", audioUrl: "../data/raw/audio/sample_4a478a58.wav" },
            { id: 2, name: "Sample 2", language: "Chakma", transcript: "মুই গম আগং।", status: "Ready", audioUrl: "../data/raw/audio/sample_a8fe0312.wav" },
            { id: 3, name: "Sample 3", language: "Chakma", transcript: "ত নাঙান কি?", status: "Ready", audioUrl: "../data/raw/audio/sample_fa9b6b26.wav" },
            { id: 4, name: "Sample 4", language: "Chakma", transcript: "ম নাঙান...", status: "Ready", audioUrl: "../data/raw/audio/sample_e3332220.wav" },
            { id: 5, name: "Sample 5", language: "Chakma", transcript: "ভাত খেইয়োচ নি?", status: "Ready", audioUrl: "../data/raw/audio/sample_bc9b8ea6.wav" },
            { id: 6, name: "Sample 6", language: "Pali", transcript: "Namo Tassa Bhagavato Arahato Sammā Sambuddhassa.", status: "Ready", audioUrl: "../data/raw/audio/sample_4f4aec2c.wav" },
            { id: 7, name: "Sample 7", language: "Pali", transcript: "Buddhaṃ saraṇaṃ gacchāmi.", status: "Ready", audioUrl: "../data/raw/audio/sample_d1dc3504.wav" },
            { id: 8, name: "Sample 8", language: "Pali", transcript: "Sabbe sattā bhavantu sukhitattā.", status: "Ready", audioUrl: "../data/raw/audio/sample_c5e5934b.wav" },
            { id: 9, name: "Sample 9", language: "Pali", transcript: "Arogyaparamā lābhā, santuṭṭhiparamaṃ dhanaṃ.", status: "Ready", audioUrl: "../data/raw/audio/sample_cac52fff.wav" }
        ];

        let filteredVoices = [...allVoices];
        
        // --- State ---
        let currentPage = 1;
        const itemsPerPage = 8;
        let currentPlayingId = null;
        
        // Playback Mode: 'off' -> 'play-all' -> 'repeat-one' -> 'shuffle'
        let playModes = ['off', 'play-all', 'repeat-one', 'shuffle'];
        let currentModeIndex = 0;

        // --- DOM Elements ---
        const tbody = document.getElementById('voice-list-body');
        const audio = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const seekBar = document.getElementById('seek-bar');
        const volumeBar = document.getElementById('volume-bar');
        const volIcon = document.getElementById('vol-icon');
        const playerEq = document.getElementById('player-eq');
        
        const modeBtn = document.getElementById('mode-btn');
        const modeIcon = document.getElementById('mode-icon');
        const prevTrackBtn = document.getElementById('btn-prev');
        const nextTrackBtn = document.getElementById('btn-next');

        // --- Render Engine ---
        function renderTable() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredVoices.slice(start, end);
            
            tbody.innerHTML = '';
            
            if (paginatedItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400 font-medium"><i class="fa-solid fa-folder-open text-3xl mb-3 opacity-50 block"></i>No audio tracks found.</td></tr>`;
            }

            paginatedItems.forEach((voice, indexInAllVoices) => {
                const isPlaying = currentPlayingId === voice.id && !audio.paused;
                
                const tr = document.createElement('tr');
                tr.className = `group transition-colors duration-150 ${isPlaying ? 'bg-blue-50/50 dark:bg-blue-900/20' : 'bg-white dark:bg-gray-900 hover:bg-gray-50 dark:hover:bg-gray-800/80'}`;
                
                // Animated Equalizer for active track
                const eqHtml = isPlaying ? `
                    <div class="equalizer ml-2">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>` : '';

                // We use the ID to link specifically to Gradio via URL query parameter (zero-indexed match to the choice list in app.py)
                const gradioIdx = voice.id - 1; // Assuming ID 1 corresponds to index 0
                const editorLink = `http://127.0.0.1:7860/?id=${gradioIdx}`;

                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-900 dark:text-white ${isPlaying ? 'text-blue-600 dark:text-blue-400' : ''}">${voice.name}</span>
                            ${eqHtml}
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 shadow-sm">
                            ${voice.language}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-gray-700 dark:text-gray-300 font-medium truncate max-w-md" title="${voice.transcript}">
                            "${voice.transcript}"
                        </div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="inline-flex items-center gap-1.5 text-xs font-bold ${voice.status === 'Ready' ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-500 dark:text-amber-400'}">
                            <span class="relative flex h-2 w-2">
                                ${isPlaying ? `<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>` : ''}
                                <span class="relative inline-flex rounded-full h-2 w-2 ${voice.status === 'Ready' ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                            </span>
                            ${isPlaying ? 'PLAYING' : voice.status.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex justify-end items-center gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                            <!-- Professional Edit Link to Gradio Editor -->
                            <a href="${editorLink}" target="_blank" class="flex items-center gap-1.5 text-xs font-bold text-gray-600 dark:text-gray-400 hover:text-white bg-gray-100 dark:bg-gray-800 hover:bg-gray-900 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 transition-all shadow-sm" title="Edit in Data Collector">
                                <i class="fa-solid fa-sliders"></i> Edit
                            </a>
                            <button onclick="loadAndPlay(${voice.id})" class="w-8 h-8 rounded-full flex items-center justify-center transition-all ${isPlaying ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 border border-gray-200 dark:border-gray-700'}" title="${isPlaying ? 'Pause' : 'Play'}">
                                <i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'}"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updatePaginationInfo();
        }

        // --- Filters & Pagination ---
        function updatePaginationInfo() {
            const total = filteredVoices.length;
            const start = total === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, total);
            document.getElementById('page-start').textContent = start;
            document.getElementById('page-end').textContent = end;
            document.getElementById('total-items').textContent = total;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = end >= total;
        }

        function applyFilters() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const lang = document.getElementById('language-filter').value;
            filteredVoices = allVoices.filter(v => {
                const matchSearch = v.transcript.toLowerCase().includes(term) || v.name.toLowerCase().includes(term);
                const matchLang = lang === 'all' || v.language === lang;
                return matchSearch && matchLang;
            });
            currentPage = 1;
            renderTable();
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('language-filter').addEventListener('change', applyFilters);
        document.getElementById('prev-btn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); }});
        document.getElementById('next-btn').addEventListener('click', () => { if (currentPage * itemsPerPage < filteredVoices.length) { currentPage++; renderTable(); }});

        // --- Player Logic ---
        
        // Single Button Cycle Logic
        function updateModeUI() {
            const mode = playModes[currentModeIndex];
            
            // Default styling for inactive
            modeBtn.className = "transition-colors text-lg w-6 flex justify-center items-center text-gray-400 hover:text-gray-900 dark:text-gray-500 dark:hover:text-white";
            
            if (mode === 'play-all') {
                modeBtn.title = "Mode: Play All";
                modeIcon.className = "fa-solid fa-list-ul";
                modeBtn.classList.add("text-blue-600", "dark:text-blue-400"); // highlight active modes
                modeBtn.classList.remove("text-gray-400", "dark:text-gray-500");
            } else if (mode === 'repeat-one') {
                modeBtn.title = "Mode: Repeat One";
                modeIcon.className = "fa-solid fa-repeat";
                modeBtn.classList.add("text-blue-600", "dark:text-blue-400");
                modeBtn.classList.remove("text-gray-400", "dark:text-gray-500");
            } else if (mode === 'shuffle') {
                modeBtn.title = "Mode: Shuffle";
                modeIcon.className = "fa-solid fa-shuffle";
                modeBtn.classList.add("text-blue-600", "dark:text-blue-400");
                modeBtn.classList.remove("text-gray-400", "dark:text-gray-500");
            } else if (mode === 'off') {
                modeBtn.title = "Mode: Play Single Track & Stop";
                modeIcon.className = "fa-solid fa-stop";
                // stays gray to show it's "off" or linear
            }
        }

        modeBtn.addEventListener('click', () => {
            currentModeIndex = (currentModeIndex + 1) % playModes.length;
            updateModeUI();
        });
        updateModeUI(); // initial state

        function getNextTrackId() {
            const mode = playModes[currentModeIndex];
            const list = filteredVoices.map(v => v.id);
            if (list.length === 0) return null;

            if (mode === 'repeat-one') {
                return currentPlayingId;
            }

            if (mode === 'shuffle') {
                return list[Math.floor(Math.random() * list.length)];
            }

            // For 'play-all' and 'off', we progress linearly
            const currentIndex = list.indexOf(currentPlayingId);
            if (currentIndex === -1) return list[0];

            if (currentIndex < list.length - 1) {
                return list[currentIndex + 1];
            } else if (mode === 'play-all') {
                return list[0]; // Loop back to start
            }
            
            return null; // mode === 'off' and at the end of the list
        }

        function getPrevTrackId() {
            const list = filteredVoices.map(v => v.id);
            if (list.length === 0) return null;
            
            const mode = playModes[currentModeIndex];
            if (mode === 'shuffle') {
                return list[Math.floor(Math.random() * list.length)];
            }
            if (mode === 'repeat-one') {
                return currentPlayingId;
            }
            
            const currentIndex = list.indexOf(currentPlayingId);
            if (currentIndex > 0) return list[currentIndex - 1];
            if (mode === 'play-all') return list[list.length - 1];
            return null;
        }

        nextTrackBtn.addEventListener('click', () => {
            // When manually clicking next, bypass 'repeat-one' and 'off' stall logic to just go to the next track in the list normally (or shuffle)
            let list = filteredVoices.map(v => v.id);
            let nextId = null;
            if (playModes[currentModeIndex] === 'shuffle') {
                nextId = list[Math.floor(Math.random() * list.length)];
            } else {
                let currentIndex = list.indexOf(currentPlayingId);
                if (currentIndex < list.length - 1) nextId = list[currentIndex + 1];
                else nextId = list[0];
            }
            if (nextId) loadAndPlay(nextId);
        });

        prevTrackBtn.addEventListener('click', () => {
            let list = filteredVoices.map(v => v.id);
            let prevId = null;
            if (playModes[currentModeIndex] === 'shuffle') {
                prevId = list[Math.floor(Math.random() * list.length)];
            } else {
                let currentIndex = list.indexOf(currentPlayingId);
                if (currentIndex > 0) prevId = list[currentIndex - 1];
                else prevId = list[list.length - 1];
            }
            if (prevId) loadAndPlay(prevId);
        });

        function loadAndPlay(id) {
            const voice = allVoices.find(v => v.id === id);
            if (!voice) return;

            if (currentPlayingId === id) {
                togglePlay();
                return;
            }

            currentPlayingId = id;
            audio.src = voice.audioUrl;
            
            // Update Player UI
            document.getElementById('now-playing-title').textContent = voice.name;
            document.getElementById('now-playing-lang').textContent = `${voice.language} • Track ID: ${voice.id}`;
            playPauseBtn.disabled = false;
            seekBar.disabled = false;

            // Auto pagination sync
            const index = filteredVoices.findIndex(v => v.id === id);
            if (index !== -1) {
                const targetPage = Math.floor(index / itemsPerPage) + 1;
                if (currentPage !== targetPage) currentPage = targetPage;
            }

            renderTable();

            audio.play().then(() => {
                playerEq.classList.remove('opacity-0');
            }).catch(e => {
                console.error("Playback error:", e);
                alert("Error playing audio: " + e.message + "\n\nPlease run a local server (e.g. `python -m http.server`) to avoid local file restrictions.");
                syncPlayUI(false);
            });
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play().then(() => playerEq.classList.remove('opacity-0')).catch(e => console.error("Playback error:", e));
            } else {
                audio.pause();
                playerEq.classList.add('opacity-0');
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        function syncPlayUI(isPlaying) {
            playIcon.className = `fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-1'} text-lg`;
            if(isPlaying) playerEq.classList.remove('opacity-0');
            else playerEq.classList.add('opacity-0');
            renderTable();
        }

        audio.addEventListener('play', () => syncPlayUI(true));
        audio.addEventListener('pause', () => syncPlayUI(false));
        audio.addEventListener('ended', () => {
            const mode = playModes[currentModeIndex];
            
            if (mode === 'off') {
                // Play single track and stop
                syncPlayUI(false);
                seekBar.value = 0;
                document.getElementById('time-current').textContent = "0:00";
                currentPlayingId = null;
                renderTable();
                return;
            }

            const nextId = getNextTrackId();
            if (nextId) {
                loadAndPlay(nextId);
            } else {
                syncPlayUI(false);
                seekBar.value = 0;
                document.getElementById('time-current').textContent = "0:00";
                currentPlayingId = null;
                renderTable();
            }
        });

        // --- Time formatting & Scrubbing ---
        function formatTime(s) {
            if (isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            return `${m}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
        }

        audio.addEventListener('timeupdate', () => {
            const cur = audio.currentTime;
            document.getElementById('time-current').textContent = formatTime(cur);
            if (audio.duration) seekBar.value = (cur / audio.duration) * 100;
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('time-total').textContent = formatTime(audio.duration);
        });

        seekBar.addEventListener('input', (e) => {
            if(audio.duration) audio.currentTime = audio.duration * (e.target.value / 100);
        });

        volumeBar.addEventListener('input', (e) => {
            const v = e.target.value / 100;
            audio.volume = v;
            if (v === 0) volIcon.className = "fa-solid fa-volume-xmark text-gray-500 dark:text-gray-400 w-5 text-center";
            else if (v < 0.5) volIcon.className = "fa-solid fa-volume-low text-gray-500 dark:text-gray-400 w-5 text-center";
            else volIcon.className = "fa-solid fa-volume-high text-gray-500 dark:text-gray-400 w-5 text-center";
        });

        // Init
        renderTable();
    </script>
</body>
</html>
